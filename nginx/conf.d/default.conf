# HTTP - redirect to HTTPS + ACME challenge
server {
    listen 80;
    server_name api-manris.dikalaksana.com manris.dikalaksana.com api-manrisk.dikalaksana.com manrisk.dikalaksana.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - legacy API remains available during the domain migration
server {
    listen 443 ssl;
    server_name api-manris.dikalaksana.com;

    ssl_certificate /etc/letsencrypt/live/api-manris.dikalaksana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-manris.dikalaksana.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

