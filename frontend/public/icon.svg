<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MANRIS tab icon</title>
  <desc id="desc">A nearly black rounded square with a subtle gray edge gradient for depth.</desc>
  <defs>
    <linearGradient id="favicon-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303030"/>
      <stop offset="0.08" stop-color="#080808"/>
      <stop offset="0.84" stop-color="#000000"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <linearGradient id="favicon-edge" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A6A6A" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#1A1A1A" stop-opacity="0.35"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#5A5A5A" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#favicon-gradient)"/>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="url(#favicon-edge)" stroke-width="6"/>
</svg>
